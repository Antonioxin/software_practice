components:
  responses:
    Error401:
      description: 未登录
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Error403:
      description: 非管理员或 CSRF 校验失败
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Error404:
      description: 资源不存在或未公开
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Error409:
      description: VERSION_CONFLICT / IDEMPOTENCY_CONFLICT / INVALID_STATE_TRANSITION
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Error422:
      description: VALIDATION_ERROR，包含字段错误
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: WEMOVE_SESSION
  schemas:
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
    VersionCommand:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      required:
      - expectedVersion
    SettingsView:
      type: object
      additionalProperties: false
      properties:
        brandName:
          type: string
          maxLength: 100
        brandDescription:
          type: string
          maxLength: 20000
        contactEmail:
          type: string
          maxLength: 250
        contactPhone:
          type: string
          maxLength: 50
        contactAddress:
          type: string
          maxLength: 250
        logoMediaId:
          type:
          - string
          - 'null'
          format: uuid
        termsText:
          type: string
          maxLength: 50000
        termsVersion:
          type: string
          maxLength: 32
        privacyText:
          type: string
          maxLength: 50000
        privacyVersion:
          type: string
          maxLength: 32
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - brandName
      - brandDescription
      - contactEmail
      - contactPhone
      - contactAddress
      - logoMediaId
      - termsText
      - termsVersion
      - privacyText
      - privacyVersion
      - version
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        brandName:
          type: string
          maxLength: 100
        brandDescription:
          type: string
          maxLength: 20000
        contactEmail:
          type: string
          maxLength: 250
        contactPhone:
          type: string
          maxLength: 50
        contactAddress:
          type: string
          maxLength: 250
        logoMediaId:
          type:
          - string
          - 'null'
          format: uuid
        termsText:
          type: string
          maxLength: 50000
        termsVersion:
          type: string
          maxLength: 32
        privacyText:
          type: string
          maxLength: 50000
        privacyVersion:
          type: string
          maxLength: 32
      required:
      - expectedVersion
      - brandName
      - termsText
      - termsVersion
      - privacyText
      - privacyVersion
    HomeAdminView:
      type: object
      additionalProperties: false
      properties:
        recommendedProductIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
        featuredArticleIds:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - recommendedProductIds
      - featuredArticleIds
      - version
    HomeUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        recommendedProductIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
        featuredArticleIds:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
      - expectedVersion
      - recommendedProductIds
      - featuredArticleIds
    PublicProduct:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        mainImageId:
          type: string
          nullable: true
        retailUnitPriceFen:
          type: integer
          format: int64
          minimum: 0
        published:
          type: boolean
        inStock:
          type: boolean
    Problem:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
    ArticleView:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 500
        body:
          type: string
          maxLength: 200000
          description: >-
            清洗后的受控 HTML；可见文本按 Unicode 码点计数，最多 20000；草稿可空，发布至少 1 字符。
            通栏图片使用 figure(img[src,alt], figcaption)；左右图文使用
            section[data-layout=image-left|image-right]，内部依次为 figure 和 div(h3,p...)。
            可保留段落、标题、列表、加粗等基础排版。图片来源与属性限制见 API 总说明。
        category:
          type: string
          maxLength: 80
        pageDescription:
          type: string
          maxLength: 300
        productIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        mediaIds:
          type: array
          description: 显式媒体按输入顺序优先（第一张作为封面），再追加清洗后正文中的媒体 ID；去重合计最多 20 张。内置 guide 图片不计入媒体引用。
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        sortOrder:
          type: integer
          format: int64
