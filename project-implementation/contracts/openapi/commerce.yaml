openapi: 3.0.3
info:
  title: WEMOVE commerce 零售交易
  version: 1.0.0
  description: FR-13—18。整车结算、零售快照价、下单不预占库存、付款全单扣减、整单取消/模拟退款、整单模拟发货与本人收货。C版本从1开始，A/B沿用原0起始版本，不做前端偏移。
servers:
- url: /api/v1
paths:
  /cart:
    get:
      operationId: commerce.readCart
      summary: commerce.readCart
      description: 仅启用普通用户/经销商，管理员不能个人购买；私人资源仅本人。 支付/退款/物流全为模拟。
      parameters: []
      responses:
        '200':
          description: 成功（创建首次201；成功重放200并带 Idempotency-Replayed:true）
          headers:
            Idempotency-Replayed:
              schema: &id001
                type: boolean
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CartView'
                  meta:
                    type: object
                    nullable: true
        '400':
          description: 损坏的JSON语法
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 会话失效或账户停用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 权限或CSRF拒绝
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 不存在或非本人资源
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: CART_CHANGED / PRICE_CHANGED / PRODUCT_UNAVAILABLE / INSUFFICIENT_STOCK
            / CHECKOUT_PREVIEW_EXPIRED / VERSION_CONFLICT / STATE_CONFLICT / IDEMPOTENCY_CONFLICT
            / REQUEST_IN_PROGRESS；后者带Retry-After:2
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 未知字段、严格类型或字段校验失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
