components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: WEMOVE_SESSION
  schemas:
    AddItem:
      type: object
      additionalProperties: false
      required:
      - productId
      - quantity
      properties:
        productId: *id003
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 99
    UpdateItem:
      type: object
      additionalProperties: false
      required:
      - quantity
      - cartVersion
      properties:
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 99
        cartVersion: *id012
    ShippingAddress:
      type: object
      additionalProperties: false
      required:
      - recipient
      - phone
      - countryOrRegion
      - city
      - addressLine
      properties:
        recipient:
          type: string
          minLength: 2
          maxLength: 50
        phone:
          type: string
          description: 允许空格、连字符、括号；标准化后为可选加号和6—20位数字
        countryOrRegion:
          type: string
          minLength: 2
          maxLength: 100
        region:
          type: string
          nullable: true
          minLength: 2
          maxLength: 100
          description: 本期所有地区均选填
        city:
          type: string
          minLength: 2
          maxLength: 100
        addressLine:
          type: string
          minLength: 5
          maxLength: 200
    CreateOrder:
      type: object
      additionalProperties: false
      required:
      - previewToken
      - cartVersion
      - shippingAddress
      properties:
        previewToken:
          type: string
          maxLength: 200
        cartVersion: *id012
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        remark:
          type: string
          maxLength: 2000
        clientTotalFen:
          type: integer
          format: int64
          minimum: 0
          description: 仅兼容输入，服务端忽略其金额值，按可信预览重算
    Payment:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - outcome
      properties:
        expectedVersion: *id012
        outcome:
          type: string
          enum:
          - SUCCESS
          - FAILURE
    Cancel:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - reason
      properties:
        expectedVersion: *id012
        reason:
          type: string
          minLength: 2
          maxLength: 500
    Receipt:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      properties:
        expectedVersion: *id012
    Shipment:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - logisticsName
      - trackingNumber
      properties:
        expectedVersion: *id012
        logisticsName:
          type: string
          minLength: 2
          maxLength: 50
        trackingNumber:
          type: string
          pattern: ^[A-Za-z0-9-]{3,50}$
    Line:
      type: object
      additionalProperties: false
      required:
      - productId
      - sku
      - name
      - unitPriceFen
      - quantity
      - subtotalFen
      - valid
      - reason
      - priceChanged
      - previousUnitPriceFen
      properties:
        productId: *id003
        sku:
          type: string
        name:
          type: string
        unitPriceFen: &id013
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 99
        subtotalFen: *id013
        valid: *id001
        reason:
          type: string
          nullable: true
        priceChanged: *id001
        previousUnitPriceFen: *id013
    CartView:
      type: object
      additionalProperties: false
      required:
      - cartVersion
      - items
      - totalFen
      - canCheckout
      - currency
      properties:
        cartVersion: *id012
        items:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        totalFen: *id013
        canCheckout: *id001
        currency:
          type: string
          enum:
          - CNY
    PreviewView:
      type: object
      additionalProperties: false
      required:
      - previewToken
      - cartVersion
      - expiresAt
      - currency
      - items
      - subtotalFen
      - shippingFen
      - taxFen
      - discountFen
      - totalFen
      properties:
        previewToken:
          type: string
        cartVersion: *id012
        expiresAt: *id011
        currency:
          type: string
          enum:
          - CNY
        items:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        subtotalFen: *id013
        shippingFen: *id013
        taxFen: *id013
        discountFen: *id013
        totalFen: *id013
    Summary:
      type: object
      additionalProperties: false
      required:
      - id
      - orderNumber
      - status
      - version
      - currency
      - totalFen
      - mode
      - createdAt
      properties:
        id: *id003
        orderNumber: &id015
          type: string
        status: *id014
        version: *id012
        currency: &id016
          type: string
          enum:
          - CNY
        totalFen: *id013
        mode: &id017
          type: string
          enum:
          - SIMULATED
        createdAt: *id011
    Attempt:
      type: object
      additionalProperties: false
      required:
      - id
      - outcome
      - amountFen
      - simulationReference
      - createdAt
      - mode
      properties:
        id: *id003
        outcome:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        amountFen: *id013
        simulationReference:
          type: string
        createdAt: *id011
        mode:
          type: string
          enum:
          - SIMULATED
    RefundView:
      type: object
      additionalProperties: false
      required:
      - id
      - amountFen
      - simulationReference
      - createdAt
      - reason
      - mode
      properties:
        id: *id003
        amountFen: *id013
        simulationReference:
          type: string
        createdAt: *id011
        reason:
          type: string
        mode:
          type: string
          enum:
          - SIMULATED
    History:
      type: object
      additionalProperties: false
      required:
      - action
      - fromStatus
      - toStatus
      - version
      - reason
      - createdAt
      properties:
        action:
          type: string
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        version: *id012
        reason:
          type: string
          nullable: true
        createdAt: *id011
    Detail:
      type: object
      additionalProperties: false
      required:
      - id
      - orderNumber
      - status
      - version
      - currency
      - totalFen
      - mode
      - createdAt
      - subtotalFen
      - shippingFen
      - taxFen
      - discountFen
      - shippingAddress
      - remark
      - items
      - paymentAttempts
      - refunds
      - history
      - allowedActions
      - logisticsName
      - trackingNumber
      - paidAt
      - shippedAt
      - completedAt
      properties:
        id: *id003
        orderNumber: *id015
        status: *id014
        version: *id012
        currency: *id016
        totalFen: *id013
        mode: *id017
        createdAt: *id011
        subtotalFen: *id013
        shippingFen: *id013
        taxFen: *id013
        discountFen: *id013
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        remark:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        paymentAttempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundView'
        history:
          type: array
          items:
            $ref: '#/components/schemas/History'
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - MOCK_PAYMENT
            - CANCEL
            - MOCK_SHIPMENT
            - CONFIRM_RECEIPT
        logisticsName:
          type: string
          nullable: true
        trackingNumber:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    OrderPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Summary'
        page:
          type: integer
          format: int64
          minimum: 1
        pageSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 50
        total:
          type: integer
          format: int64
          minimum: 0
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int64
          minimum: 0
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
